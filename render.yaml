services:
  - type: web
    name: easybet-value-radar
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
